<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SHARE_TITLE%</title>
    <meta name="description" content="%SHARE_DESC%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Link previews (WhatsApp / Facebook / iMessage / Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SHARE_TITLE%" />
    <meta property="og:description" content="%SHARE_DESC%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nishtha &amp; Pranshu — wedding invitation" />
    %OG_URL%
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SHARE_TITLE%" />
    <meta name="twitter:description" content="%SHARE_DESC%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <!-- Fonts (Playfair Display, EB Garamond, Prata, Great Vibes, Tiro Devanagari Hindi — Google Fonts) are self-hosted via @fontsource: see src/main.ts -->
    <link rel="preload" as="image" href="images/00-cover-640.webp"
      imagesrcset="images/00-cover-640.webp 640w, images/00-cover.webp 1024w"
      imagesizes="(min-width: 900px) 56svh, 96vw" fetchpriority="high" />

    <script>
      // Progressive enhancement: CSS hides animated content only when this class is present.
      // If the main script never reports ready, fall back to a fully static page.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        if (!location.hash || location.hash === '#top') d.classList.add('env-open');
        setTimeout(function () {
          if (!window.__inviteReady) d.classList.remove('js', 'env-open');
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#schedule">Skip to event details</a>
    <!--APP-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
